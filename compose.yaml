name: 'tripgo'

services:
  app:
    build: .
    image: 'tripgo:latest'
    pull_policy: build
    restart: unless-stopped

    ports:
      - "${HTTP_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    environment:
      HTTP_PORT: '8080'
      DATABASE_PASSWORD_FILE: '/run/secrets/postgres_password'
      LOG_LEVEL: "${LOG_LEVEL}"
      SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT}"
      DATABASE_URL: "postgres://tripgo@postgres:5432/tripgo?sslmode=disable"
      DATABASE_MAX_CONNS: "${DATABASE_MAX_CONNS}"
      DATABASE_MIN_CONNS: "${DATABASE_MIN_CONNS}"
      DATABASE_MAX_CONN_LIFETIME: "${DATABASE_MAX_CONN_LIFETIME}"
      DATABASE_CONNECT_TIMEOUT: "${DATABASE_CONNECT_TIMEOUT}"
      DATABASE_QUERY_TIMEOUT: "${DATABASE_QUERY_TIMEOUT}"
      HTTP_READ_TIMEOUT: "${HTTP_READ_TIMEOUT:-10s}"
      HTTP_READ_HEADER_TIMEOUT: "${HTTP_READ_HEADER_TIMEOUT:-5s}"
      HTTP_WRITE_TIMEOUT: "${HTTP_WRITE_TIMEOUT:-10s}"
      HTTP_IDLE_TIMEOUT: "${HTTP_IDLE_TIMEOUT:-60s}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-trip-service}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${DOCKER_OTEL_EXPORTER_OTLP_ENDPOINT:-http://tripgo-local-control-plane:30206}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}"
      OTEL_RESOURCE_ATTRIBUTES: "${OTEL_RESOURCE_ATTRIBUTES:-}"
      OTEL_TRACES_SAMPLER: "${OTEL_TRACES_SAMPLER:-parentbased_always_on}"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - default
      - observability

    secrets:
      - postgres_password

  postgres:
    image: 'postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722'

    environment:
      POSTGRES_USER: 'tripgo'
      POSTGRES_DB: 'tripgo'
      POSTGRES_PASSWORD_FILE: '/run/secrets/postgres_password'

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripgo -d tripgo"]
      interval: 5s
      timeout: 3s
      retries: 10

    secrets:
      - postgres_password

    volumes:
      - postgres_data:/var/lib/postgresql

  migrate:
    build:
      target: builder

    depends_on:
      postgres:
        condition: service_healthy

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |
        export PGPASSWORD="$$(cat /run/secrets/postgres_password)"
        exec go tool goose -dir migrations postgres 'postgres://tripgo@postgres:5432/tripgo?sslmode=disable' up

    secrets:
      - postgres_password

secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD

volumes:
  postgres_data:

networks:
  observability:
    external: true
    name: kind
